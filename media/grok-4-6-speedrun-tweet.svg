<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Grok 4.6 Terminal-Bench developer speedrun results</title>
  <desc id="desc">Grok 4.6 verified 13 of 15 trials with a 76 second overall median time to verified solution. Grok Build had the fastest harness median at 61 seconds.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100a"/>
      <stop offset="0.58" stop-color="#050806"/>
      <stop offset="1" stop-color="#0b0d0c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20e56f"/>
      <stop offset="1" stop-color="#a6ffbf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1490" cy="55" r="250" fill="#1cf26a" opacity="0.08" filter="url(#glow)"/>
  <g opacity="0.10" stroke="#79ff9f" stroke-width="1">
    <path d="M0 180H1600M0 360H1600M0 540H1600M0 720H1600"/>
    <path d="M320 0V900M640 0V900M960 0V900M1280 0V900"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="90" y="82" fill="#91f9ae" font-size="25" font-weight="600" letter-spacing="4">GROK 4.6 × TERMINAL-BENCH 2.0</text>
    <text x="90" y="163" fill="#f4fff6" font-size="70" font-weight="700" letter-spacing="-2">GETS TO GREEN. FAST.</text>
    <text x="90" y="207" fill="#a7b5aa" font-size="24">Curated developer speedrun across five coding harnesses</text>

    <g transform="translate(90 252)">
      <text x="0" y="52" fill="#f4fff6" font-size="54" font-weight="700">13/15</text>
      <text x="0" y="84" fill="#91a096" font-size="19" letter-spacing="1.5">VERIFIED TRIALS</text>

      <line x1="260" y1="2" x2="260" y2="92" stroke="#314238"/>
      <text x="310" y="52" fill="#f4fff6" font-size="54" font-weight="700">76s</text>
      <text x="310" y="84" fill="#91a096" font-size="19" letter-spacing="1.5">MEDIAN TIME-TO-GREEN</text>

      <line x1="625" y1="2" x2="625" y2="92" stroke="#314238"/>
      <text x="675" y="52" fill="#f4fff6" font-size="54" font-weight="700">22.6</text>
      <text x="675" y="84" fill="#91a096" font-size="19" letter-spacing="1.5">VERIFIED SOLVES / AGENT-HOUR</text>

      <line x1="1100" y1="2" x2="1100" y2="92" stroke="#314238"/>
      <text x="1150" y="52" fill="#f4fff6" font-size="54" font-weight="700">~$2.13</text>
      <text x="1150" y="84" fill="#91a096" font-size="19" letter-spacing="1.5">EST. API COST</text>
    </g>

    <text x="90" y="405" fill="#b9c6bc" font-size="20" letter-spacing="1.5">MEDIAN SECONDS TO A VERIFIED SOLUTION</text>
    <text x="1450" y="405" fill="#718078" font-size="18" text-anchor="end">LOWER IS FASTER</text>

    <g font-size="23">
      <text x="90" y="463" fill="#f2fff4" font-weight="650">Grok Build</text>
      <rect x="315" y="437" width="354" height="34" rx="17" fill="url(#bar)"/>
      <text x="690" y="463" fill="#f2fff4" font-weight="700">61s</text>
      <rect x="1350" y="435" width="100" height="38" rx="19" fill="#173c25"/>
      <text x="1400" y="462" fill="#a6ffbf" font-size="18" font-weight="650" text-anchor="middle">3/3</text>

      <text x="90" y="527" fill="#f2fff4" font-weight="550">Claude Code</text>
      <rect x="315" y="501" width="441" height="34" rx="17" fill="#49d97d" opacity="0.86"/>
      <text x="777" y="527" fill="#f2fff4" font-weight="700">76s</text>
      <rect x="1350" y="499" width="100" height="38" rx="19" fill="#173c25"/>
      <text x="1400" y="526" fill="#a6ffbf" font-size="18" font-weight="650" text-anchor="middle">3/3</text>

      <text x="90" y="591" fill="#f2fff4" font-weight="550">Codex</text>
      <rect x="315" y="565" width="632" height="34" rx="17" fill="#49d97d" opacity="0.72"/>
      <text x="968" y="591" fill="#f2fff4" font-weight="700">109s</text>
      <rect x="1350" y="563" width="100" height="38" rx="19" fill="#173c25"/>
      <text x="1400" y="590" fill="#a6ffbf" font-size="18" font-weight="650" text-anchor="middle">3/3</text>

      <text x="90" y="655" fill="#f2fff4" font-weight="550">Pi</text>
      <rect x="315" y="629" width="672" height="34" rx="17" fill="#49d97d" opacity="0.58"/>
      <text x="1008" y="655" fill="#f2fff4" font-weight="700">116s</text>
      <rect x="1350" y="627" width="100" height="38" rx="19" fill="#3b3020"/>
      <text x="1400" y="654" fill="#ffd58a" font-size="18" font-weight="650" text-anchor="middle">2/3</text>

      <text x="90" y="719" fill="#f2fff4" font-weight="550">OpenCode</text>
      <rect x="315" y="693" width="944" height="34" rx="17" fill="#49d97d" opacity="0.44"/>
      <text x="1280" y="719" fill="#f2fff4" font-weight="700">163s</text>
      <rect x="1350" y="691" width="100" height="38" rx="19" fill="#3b3020"/>
      <text x="1400" y="718" fill="#ffd58a" font-size="18" font-weight="650" text-anchor="middle">2/3</text>
    </g>

    <line x1="90" y1="782" x2="1510" y2="782" stroke="#2b3830"/>
    <text x="90" y="828" fill="#8c9b90" font-size="18">3 curated tasks · 15 trials · 5-minute cap · agent execution only · 1 attempt</text>
    <text x="1510" y="828" fill="#91f9ae" font-size="19" font-weight="650" text-anchor="end" letter-spacing="1.5">VIA MERGE GATEWAY</text>
    <text x="90" y="860" fill="#5f6c63" font-size="15">Not an official leaderboard submission. Median shown over verified trials; failures remain in pass rate and solves/hour.</text>
  </g>
</svg>
